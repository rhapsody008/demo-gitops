apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-intake
spec:
  # No replicas field: it defaults to 1 and the HPA (min 1) owns the count, so
  # Flux never fights the HPA by resetting it.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: secure-intake
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: secure-intake
    spec:
      automountServiceAccountToken: false # the app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # imagePullSecrets:          # only needed if the GHCR package is private
      #   - name: ghcr-pull
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: secure-intake
      containers:
        - name: app
          image: ghcr.io/rhapsody008/sovereign-ai-demo
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: secure-intake-config
            # S3_ACCESS_KEY, S3_SECRET_KEY (required); NAI_API_KEY, ADMIN_TOKEN (optional).
            # Created out of band — see secret.example.yaml.
            - secretRef:
                name: secure-intake-secrets
            # Per-cluster identity (CLUSTER_NAME, CLUSTER_DISPLAY_NAME, CLUSTER_ROLE),
            # created by hand on each cluster so one NKP project can deploy identical
            # manifests everywhere. Listed last so it overrides the values above.
            # See cluster-config.example.yaml.
            - configMapRef:
                name: secure-intake-cluster
                optional: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Readiness is quick so a replacement pod gets traffic ~2s after it is up
          # (self-healing demo) but tolerates ~6s of failures; liveness is relaxed
          # (~15s) so CPU stress tests don't trigger restarts.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
