# NOT applied by Flux — do not commit real keys. Create the Secret on BOTH
# clusters, in the namespace the app runs in, e.g.:
#
#   kubectl -n sovereign-ai create secret generic secure-intake-secrets \
#     --from-literal=S3_ACCESS_KEY=<objects access key> \
#     --from-literal=S3_SECRET_KEY=<objects secret key>
#
# Optional keys: NAI_API_KEY (fallback until a key is saved from the UI),
# ADMIN_TOKEN (require a token to change NAI settings in the UI).
apiVersion: v1
kind: Secret
metadata:
  name: secure-intake-secrets
type: Opaque
stringData:
  S3_ACCESS_KEY: "<objects access key>"
  S3_SECRET_KEY: "<objects secret key>"
  # NAI_API_KEY: ""
  # ADMIN_TOKEN: ""
