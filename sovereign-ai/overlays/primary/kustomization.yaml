apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: secure-intake-config
    behavior: merge
    literals:
      - CLUSTER_NAME=workload-demo-primary # TODO: real cluster name
      - CLUSTER_DISPLAY_NAME=Workload Demo Primary Cluster # TODO: real cluster display name
      - CLUSTER_ROLE=primary # blue banner; seeds sample records into an empty bucket
