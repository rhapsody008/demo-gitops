apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: secure-intake-config
    behavior: merge
    literals:
      - CLUSTER_NAME=workload-demo-standby # TODO: real cluster name
      - CLUSTER_DISPLAY_NAME=Workload Demo Standby Cluster # TODO: real cluster display name
      - CLUSTER_ROLE=standby # orange banner
