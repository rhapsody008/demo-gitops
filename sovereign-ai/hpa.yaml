apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secure-intake
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secure-intake
  minReplicas: 1 # single pod so deleting it shows Kubernetes self-healing
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
