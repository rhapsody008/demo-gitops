# The app lists its own pods to show a live pod count on the NKP cluster tile.
# Namespaced and read-only: list pods in the app's namespace, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-intake
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secure-intake-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secure-intake-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secure-intake-pod-reader
subjects:
  - kind: ServiceAccount
    name: secure-intake # namespace is filled in from the project's target namespace
