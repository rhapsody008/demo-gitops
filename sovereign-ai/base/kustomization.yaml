apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: secure-intake
      app.kubernetes.io/part-of: sovereign-ai-demo
    includeSelectors: false

resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  # - hpa.yaml   # off: the overlays pin replicas (standby 0), which an HPA (min 1) would override
  - ingress.yaml

images:
  - name: ghcr.io/rhapsody008/sovereign-ai-demo
    newTag: latest # pin to a sha-<short> tag before the event

# Settings shared by both clusters. Per-cluster identity (secure-intake-cluster)
# and per-cluster overrides live in overlays/primary and overlays/standby.
configMapGenerator:
  - name: secure-intake-config
    literals:
      - BASE_PATH=/piishield
      # Nutanix Objects. Both clusters MUST point at the same bucket.
      - S3_ENDPOINT=10.8.79.10 # TODO: Objects store host[:port]
      - S3_BUCKET=secure-intake
      - S3_USE_TLS=true
      - S3_INSECURE_SKIP_VERIFY=true # lab Objects certs are usually self-signed
      - S3_REGION=us-east-1
      # NAI is configured from the UI and saved in the bucket. These are only a fallback.
      - NAI_BASE_URL=
      - NAI_MODEL=
      - NAI_TIMEOUT=60s
      - NAI_INSECURE_SKIP_VERIFY=true
      - MAX_UPLOAD_MB=8
      - SEED_SAMPLE_RECORDS=true
      # Fixed values on the NKP cluster tile. The pod count is read live.
      - DEMO_NODES=3
      - DEMO_HPA_MAX=6
